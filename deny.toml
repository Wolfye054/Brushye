# cargo-deny configuration (DECISIONS D-016).
# Every dependency, including transitive ones, must be compatible with MIT OR Apache-2.0.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list covers licenses expected once dependencies arrive; unused entries are fine.
unused-allowed-license = "allow"
# Permissive licenses only. Add to this list only with a DECISIONS.md note.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
]
# Font licenses, for egui's bundled UI fonts only (Ubuntu font, Hack, Noto Emoji, Emoji Icon
# Font). Fonts are data shipped with the app, not linked code; both licenses allow bundling them
# with MIT/Apache software. DECISIONS D-016, M6 note.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
