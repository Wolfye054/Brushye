name: Release builds

# Builds the app, the CLI and the MCP server (brushye-mcp) on Windows, macOS and Linux: a .zip for Windows, an AppImage and a
# .tar.gz for Linux, a .tar.gz for macOS. Pushing a tag v* also creates a DRAFT GitHub release
# with them attached; the maintainer reviews and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: the binary then runs on distros with glibc >= 2.35.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --locked -p brushye-app -p brushye-cli -p brushye-mcp
      - name: package
        shell: bash
        run: |
          dir="brushye-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir -p "$dir"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/release/brushye-app$ext" "target/release/brushye$ext" "target/release/brushye-mcp$ext" "$dir/"
          cp LICENSE-MIT LICENSE-APACHE "$dir/"
          cp crates/brushye-app/assets/fonts/LICENSE-GoFonts.txt crates/brushye-app/assets/fonts/LICENSE-Phosphor.txt "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ARCHIVE=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          # appimagetool 1.9.1, pinned by checksum (github.com/AppImage/appimagetool).
          TOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          TOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl -sSfL -o appimagetool "$TOOL_URL"
          echo "$TOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          app=Brushye.AppDir
          mkdir -p "$app/usr/bin" "$app/usr/share/applications" "$app/usr/share/icons/hicolor/256x256/apps" "$app/usr/share/doc/brushye"
          cp target/release/brushye-app target/release/brushye target/release/brushye-mcp "$app/usr/bin/"
          cp packaging/linux/brushye.desktop "$app/"
          cp packaging/linux/brushye.desktop "$app/usr/share/applications/"
          cp crates/brushye-app/assets/icon/brushye.png "$app/brushye.png"
          cp crates/brushye-app/assets/icon/brushye.png "$app/usr/share/icons/hicolor/256x256/apps/"
          ln -s brushye.png "$app/.DirIcon"
          ln -s usr/bin/brushye-app "$app/AppRun"
          cp LICENSE-MIT LICENSE-APACHE crates/brushye-app/assets/fonts/LICENSE-GoFonts.txt crates/brushye-app/assets/fonts/LICENSE-Phosphor.txt "$app/usr/share/doc/brushye/"
          out="brushye-${GITHUB_REF_NAME//\//-}-x86_64.AppImage"
          # Embedded update information: AppImage updaters (e.g. Gear Lever) look for the
          # .zsync file of the newest non-draft, non-prerelease GitHub release.
          upd="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|brushye-*-x86_64.AppImage.zsync"
          # No FUSE on the runner: the tool extracts itself and runs. With -u it also writes
          # "$out.zsync" next to the AppImage.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream -u "$upd" "$app" "$out"
          test -s "$out.zsync"
          echo "APPIMAGE=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.APPIMAGE }}
            ${{ env.APPIMAGE && format('{0}.zsync', env.APPIMAGE) || '' }}

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create draft release (or add to an existing release for this tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made for the tag on GitHub's website gets the files; otherwise a new
          # DRAFT is created for the maintainer to review and publish (Releases page > Drafts).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*/* --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "Brushye $GITHUB_REF_NAME"
          fi
