name: Release builds

# Builds the app and CLI on Windows, macOS and Linux. Pushing a tag v* also creates a DRAFT
# GitHub release with the archives attached; the maintainer reviews and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --locked -p brushye-app -p brushye-cli
      - name: package
        shell: bash
        run: |
          dir="brushye-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir -p "$dir"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/release/brushye-app$ext" "target/release/brushye$ext" "$dir/"
          cp LICENSE-MIT LICENSE-APACHE "$dir/"
          cp crates/brushye-app/assets/fonts/LICENSE-GoFonts.txt crates/brushye-app/assets/fonts/LICENSE-Phosphor.txt "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ARCHIVE=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*/* --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "Brushye $GITHUB_REF_NAME"
