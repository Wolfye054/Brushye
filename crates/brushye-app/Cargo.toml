[package]
name = "brushye-app"
description = "The Brushye desktop app: egui/eframe UI, wgpu canvas display, tablet input (DECISIONS D-010, D-012, D-015)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "brushye-app"
path = "src/main.rs"

[dependencies]
brushye-command = { path = "../brushye-command" }
brushye-format = { path = "../brushye-format" }
brushye-sut = { path = "../brushye-sut" }
brushye-tablet = { path = "../brushye-tablet" }
# Attach mode (D-022): the MCP tool core and local endpoint, without rmcp/tokio.
brushye-mcp = { path = "../brushye-mcp", default-features = false }
serde_json = "1"
# Native file dialogs (D-019): Windows IFileDialog, macOS NSOpenPanel, Linux XDG portal.
rfd = "0.17"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11"] }
