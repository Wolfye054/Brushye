[package]
name = "brushye-core"
description = "Brushye document model, colour/blend math, brush engine and CPU reference renderer (DECISIONS D-010). No UI/GPU/OS dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Correctly specified, pure-Rust sin/cos for the tip angle: identical on every platform (D-012, D-016).
libm = "0.2"

[dev-dependencies]
png = "0.18"
proptest = "1"
