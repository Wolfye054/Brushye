[package]
name = "brushye-mcp"
description = "Brushye MCP server: exposes the command and query registry to AI clients over stdio (DECISIONS D-010, D-011)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "brushye-mcp"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The MCP server binary. The app uses the library without it (D-022), so it doesn't link
# rmcp or tokio.
server = ["dep:rmcp", "dep:tokio"]

[lints]
workspace = true

[dependencies]
brushye-command = { path = "../brushye-command" }
brushye-format = { path = "../brushye-format" }
base64 = "0.22"
serde_json = "1"
# Official Rust MCP SDK (D-016). Tools are built from the command registry at runtime, so the
# `macros` feature is not needed.
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"], optional = true }
# rmcp's runtime; the server runs on one thread and does document work on the blocking pool.
tokio = { version = "1", features = ["rt", "macros", "io-std"], optional = true }
# Local sockets / named pipes for attach mode (D-022).
interprocess = "2.4"
